# Fly.io API for globaletf (Hong Kong — lower latency to mainland China than US/EU).
# Setup:  bash scripts/deploy-api.sh
# Seed:   fly ssh console -a globaletf-api -C "npm run sync:daily"

app = "globaletf-api"
primary_region = "hkg"

[build]
  dockerfile = "Dockerfile.api"

[env]
  HOST = "0.0.0.0"
  PORT = "8787"
  DATABASE_PATH = "/app/data/etflimit.sqlite"
  NODE_ENV = "production"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[[mounts]]
  source = "globaletf_data"
  destination = "/app/data"
