# Fly.io config for the API service (deployment option B).
# 1. fly apps create etflimit-api
# 2. fly volumes create etflimit_data --region hkg --size 1
# 3. fly deploy
# 4. fly certs add api.yourdomain.com

app = "etflimit-api"
primary_region = "hkg"

[build]
  dockerfile = "Dockerfile.api"

[env]
  HOST = "0.0.0.0"
  PORT = "8787"
  DATABASE_PATH = "/app/data/etflimit.sqlite"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[[mounts]]
  source = "etflimit_data"
  destination = "/app/data"
